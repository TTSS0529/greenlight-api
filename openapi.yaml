```yaml
openapi: 3.1.0

info:
  title: Greenlight API
  description: |
    A RESTful API for managing movies, users, authentication, and favorite movies.
  version: 1.0.0

servers:
  - url: http://localhost
    description: Local development server

tags:
  - name: Health
    description: API health and status
  - name: Movies
    description: Movie management
  - name: Favorites
    description: Favorite movies
  - name: Users
    description: User registration and activation
  - name: Authentication
    description: Authentication token management
  - name: Debug
    description: Runtime debugging information

paths:

  /v1/healthcheck:
    get:
      tags:
        - Health
      summary: Check API health
      operationId: getHealthcheck
      responses:
        "200":
          description: API is available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthcheckResponse"
              example:
                status: available
                system_info:
                  environment: development
                  version: "1.0.0"

  /v1/movies:
    get:
      tags:
        - Movies
      summary: List movies
      description: |
        Returns a paginated list of movies.

        The endpoint supports full-text title search, genre filtering,
        pagination, and sorting.
        
        Requires an authenticated, activated user with the `movies:read`
        permission.
      operationId: listMovies
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Title"
        - $ref: "#/components/parameters/Genres"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/MovieSort"
      responses:
        "200":
          description: A paginated list of movies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieListResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"
        "500":
          $ref: "#/components/responses/ServerError"

    post:
      tags:
        - Movies
      summary: Create a movie
      description: |
        Creates a new movie.

        Requires an authenticated, activated user with the `movies:write`
        permission.
      operationId: createMovie
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovieCreateRequest"
            example:
              title: The Shawshank Redemption
              year: 1994
              runtime: "142 mins"
              genres:
                - drama
                - crime
      responses:
        "201":
          description: Movie created successfully
          headers:
            Location:
              description: URL of the newly created movie
              schema:
                type: string
                example: /v1/movies/1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/movies/{id}:
    parameters:
      - $ref: "#/components/parameters/MovieID"

    get:
      tags:
        - Movies
      summary: Get a movie
      description: |
        Returns a single movie.

        Requires an authenticated, activated user with the `movies:read`
        permission.
      operationId: getMovie
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Movie returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"
        "500":
          $ref: "#/components/responses/ServerError"

    patch:
      tags:
        - Movies
      summary: Update a movie
      description: |
        Partially updates a movie. Only fields supplied in the request
        are changed.

        The update uses optimistic locking through the movie version field.

        Requires an authenticated, activated user with the `movies:write`
        permission.
      operationId: updateMovie
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovieUpdateRequest"
            example:
              title: The Shawshank Redemption
              runtime: "142 mins"
      responses:
        "200":
          description: Movie updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/EditConflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"
        "500":
          $ref: "#/components/responses/ServerError"

    delete:
      tags:
        - Movies
      summary: Delete a movie
      description: |
        Deletes a movie.

        Requires an authenticated, activated user with the `movies:write`
        permission.
      operationId: deleteMovie
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Movie deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                message: movie successfully deleted
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/movies/{id}/favorite:
    parameters:
      - $ref: "#/components/parameters/MovieID"

    post:
      tags:
        - Favorites
      summary: Add a movie to favorites
      description: |
        Adds a movie to the authenticated user's favorites.

        Requires an authenticated, activated user with the `movies:read`
        permission.
      operationId: addFavorite
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Movie added to favorites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                message: movie added to favorites
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"
        "500":
          $ref: "#/components/responses/ServerError"

    delete:
      tags:
        - Favorites
      summary: Remove a movie from favorites
      description: |
        Removes a movie from the authenticated user's favorites.

        Requires an authenticated, activated user with the `movies:read`
        permission.
      operationId: removeFavorite
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Movie removed from favorites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                message: movie removed from favorites
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/favorites:
    get:
      tags:
        - Favorites
      summary: List favorite movies
      description: |
        Returns the authenticated user's favorite movies, ordered from
        most recently favorited to least recently favorited.

        Requires an authenticated, activated user with the `movies:read`
        permission.
      operationId: listFavorites
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Favorite movies returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteListResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/users:
    post:
      tags:
        - Users
      summary: Register a user
      description: |
        Registers a new user.

        The new account is initially inactive. An activation token is
        generated and an activation email is sent asynchronously.

        The endpoint returns HTTP 202 Accepted because the email delivery
        is performed in the background.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegistrationRequest"
            example:
              name: Alice Smith
              email: alice@example.com
              password: password123
      responses:
        "202":
          description: User accepted for registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Email address is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/users/activated:
    put:
      tags:
        - Users
      summary: Activate a user account
      description: |
        Activates a user account using an activation token.

        Activation tokens are valid for three days.
      operationId: activateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivationRequest"
            example:
              token: ABCDEFGHIJKLMNOPQRSTUVWXYZ
      responses:
        "200":
          description: User activated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/EditConflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/tokens/authentication:
    post:
      tags:
        - Authentication
      summary: Create an authentication token
      description: |
        Authenticates a user with an email address and password and returns
        a bearer authentication token.

        Authentication tokens are valid for 24 hours.
      operationId: createAuthenticationToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthenticationRequest"
            example:
              email: alice@example.com
              password: password123
      responses:
        "201":
          description: Authentication token created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationTokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid authentication credentials
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: Bearer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"
        "500":
          $ref: "#/components/responses/ServerError"

  /debug/vars:
    get:
      tags:
        - Debug
      summary: Get runtime metrics
      description: |
        Returns Go expvar runtime variables and application metrics.

        This endpoint is provided by Go's `expvar` package.
      operationId: getDebugVars
      responses:
        "200":
          description: Runtime variables
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "429":
          $ref: "#/components/responses/RateLimitExceeded"

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque token
      description: |
        Stateful bearer authentication token returned by
        `/v1/tokens/authentication`.

  parameters:

    MovieID:
      name: id
      in: path
      required: true
      description: Movie ID. Must be a positive integer.
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1

    Title:
      name: title
      in: query
      required: false
      description: Full-text search term for the movie title.
      schema:
        type: string
      example: shawshank

    Genres:
      name: genres
      in: query
      required: false
      description: |
        Comma-separated list of genres. Movies must contain all supplied
        genres.
      schema:
        type: string
      example: drama,crime

    Page:
      name: page
      in: query
      required: false
      description: Page number.
      schema:
        type: integer
        minimum: 1
        maximum: 10000000
        default: 1
      example: 1

    PageSize:
      name: page_size
      in: query
      required: false
      description: Number of movies returned per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20

    MovieSort:
      name: sort
      in: query
      required: false
      description: |
        Sort order. Prefix the field with `-` for descending order.
      schema:
        type: string
        enum:
          - id
          - title
          - year
          - runtime
          - -id
          - -title
          - -year
          - -runtime
        default: id
      example: -year

  schemas:

    Runtime:
      type: string
      pattern: '^[0-9]+ mins$'
      description: |
        Movie runtime represented as a string containing a positive integer
        followed by `mins`.
      example: 142 mins

    Movie:
      type: object
      required:
        - id
        - title
        - year
        - runtime
        - genres
        - version
      properties:
        id:
          type: integer
          format: int64
          description: Unique movie identifier.
          example: 1

        title:
          type: string
          maxLength: 500
          description: Movie title.
          example: The Shawshank Redemption

        year:
          type: integer
          format: int32
          minimum: 1888
          description: Release year. The API also rejects future years.
          example: 1994

        runtime:
          $ref: "#/components/schemas/Runtime"

        genres:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            type: string
          description: Movie genres.
          example:
            - drama
            - crime

        version:
          type: integer
          format: int32
          description: Version used for optimistic locking.
          example: 1

    MovieCreateRequest:
      type: object
      required:
        - title
        - year
        - runtime
        - genres
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 500
          description: Movie title.

        year:
          type: integer
          format: int32
          minimum: 1888
          description: Release year. Future years are rejected.

        runtime:
          $ref: "#/components/schemas/Runtime"

        genres:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            type: string

    MovieUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          maxLength: 500

        year:
          type: integer
          format: int32
          minimum: 1888

        runtime:
          $ref: "#/components/schemas/Runtime"

        genres:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            type: string

    Favorite:
      type: object
      required:
        - id
        - title
      properties:
        id:
          type: integer
          format: int64
          example: 1

        title:
          type: string
          example: The Shawshank Redemption

        year:
          type: integer
          format: int32
          example: 1994

        runtime:
          $ref: "#/components/schemas/Runtime"

        genres:
          type: array
          items:
            type: string
          example:
            - drama
            - crime

    Metadata:
      type: object
      properties:
        current_page:
          type: integer
          example: 1

        page_size:
          type: integer
          example: 20

        first_page:
          type: integer
          example: 1

        last_page:
          type: integer
          example: 5

        total_records:
          type: integer
          example: 97

    User:
      type: object
      required:
        - id
        - created_at
        - name
        - email
        - activated
      properties:
        id:
          type: integer
          format: int64
          example: 1

        created_at:
          type: string
          format: date-time
          example: "2026-09-30T18:30:00Z"

        name:
          type: string
          maxLength: 500
          example: Alice Smith

        email:
          type: string
          format: email
          example: alice@example.com

        activated:
          type: boolean
          example: false

    UserRegistrationRequest:
      type: object
      required:
        - name
        - email
        - password
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 500

        email:
          type: string
          format: email

        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72

    ActivationRequest:
      type: object
      required:
        - token
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 26
          maxLength: 26
          description: 26-character account activation token.

    AuthenticationRequest:
      type: object
      required:
        - email
        - password
      additionalProperties: false
      properties:
        email:
          type: string
          format: email

        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72

    Token:
      type: object
      required:
        - token
        - expiry
      properties:
        token:
          type: string
          description: Opaque bearer token.
          example: JBSWY3DPEHPK3PXPJBSWY3DPEH

        expiry:
          type: string
          format: date-time
          example: "2026-10-01T18:30:00Z"

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: the requested resource could not be found

    ValidationErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties:
            type: string
          example:
            title: must be provided
            year: must not be in the future

    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string

    HealthcheckResponse:
      type: object
      required:
        - status
        - system_info
      properties:
        status:
          type: string
          example: available

        system_info:
          type: object
          required:
            - envirnment
            - version
          properties:
            environment:
              type: string
              description: |
                Environment name. Note that the current implementation
                exposes this property as `envirnment`.
              example: development

            version:
              type: string
              example: "1.0.0"

    MovieResponse:
      type: object
      required:
        - movie
      properties:
        movie:
          $ref: "#/components/schemas/Movie"

    MovieListResponse:
      type: object
      required:
        - movies
        - metadata
      properties:
        movies:
          type: array
          items:
            $ref: "#/components/schemas/Movie"

        metadata:
          $ref: "#/components/schemas/Metadata"

    FavoriteListResponse:
      type: object
      required:
        - favorites
      properties:
        favorites:
          type: array
          items:
            $ref: "#/components/schemas/Favorite"

    UserResponse:
      type: object
      required:
        - user
      properties:
        user:
          $ref: "#/components/schemas/User"

    AuthenticationTokenResponse:
      type: object
      required:
        - authentication_token
      properties:
        authentication_token:
          $ref: "#/components/schemas/Token"

  responses:

    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    AuthenticationRequired:
      description: Authentication is required
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: you must be authenticated to access this resource

    Forbidden:
      description: The authenticated user is not permitted to access the resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            inactive:
              value:
                error: your user account must be activated to access this resource
            insufficient_permissions:
              value:
                error: your user account doesn't have the necessary permissions to access this resource

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: the requested resource could not be found

    EditConflict:
      description: Optimistic locking conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: unable to update the record due to an edit conflict, please try again

    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"

    RateLimitExceeded:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: rate limit exceeded

    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: the server encountered a problem and could not process your request
```
